name: excavator
# Scoop's own updater: checks Quill's latest release every few hours and
# commits the new version and SHA-256 (from the release's SHA256SUMS.txt).
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  excavate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: excavate
        uses: ScoopInstaller/GithubActions@v3.0.0
        env:
          SKIP_UPDATED: '1'
